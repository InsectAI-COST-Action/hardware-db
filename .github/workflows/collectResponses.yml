name: Collect Responses

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_run:
    workflows: ["Create Form"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  check_tests:
    runs-on: ubuntu-latest
    # Only proceed if:
    # - not triggered by workflow_run
    # - OR Create Form succeeded
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      tests_ok: ${{ steps.check.outputs.tests_ok }}

    steps:
      - name: Check latest tests run success
        id: check
        uses: actions/github-script@v6
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'tests.yml',
              per_page: 1
            });

            if (!runs.data.workflow_runs || runs.data.workflow_runs.length === 0) {
              core.setOutput('tests_ok', 'false');
            } else {
              const conclusion = runs.data.workflow_runs[0].conclusion;
              core.setOutput('tests_ok', conclusion === 'success' ? 'true' : 'false');
            }

  collect_responses:
    needs: check_tests
    runs-on: ubuntu-latest
    if: ${{ needs.check_tests.outputs.tests_ok == 'true' }}

    env:
      TZ: Europe/Zurich
      OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
      REFRESH_TOKEN_JSON: ${{ secrets.REFRESH_TOKEN_JSON }}
      TOKEN_COLLECT_RESPONSES: "" # force use of refresh token

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run collect responses
        run: python collectResponses.py

      - name: Generate device index
        run: python generateIndex.py

      - name: Commit and push data outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/form_responses.csv docs/devices_index.json docs/form_config.json || true
          git commit -m "Update data from form responses" || echo "No changes to commit"
          git push

      - name: Detect collisions
        id: collisions
        run: |
          HAS_COLLISIONS=$(python -c "import json, pathlib; p = pathlib.Path('data/_pending/collision_report.json'); print('true' if p.exists() and json.loads(p.read_text(encoding='utf-8')).get('collision_count', 0) > 0 else 'false')")
          echo "has_collisions=${HAS_COLLISIONS}" >> "$GITHUB_OUTPUT"

      - name: Open PR for collision review
        if: steps.collisions.outputs.has_collisions == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add pending collision records"
          title: "Collision review needed for collected responses"
          body: |
            This PR was created automatically because one or more form responses
            would overwrite existing device records.

            Please review the pending payloads in `data/_pending/` and decide
            how each collision should be resolved.
          branch: "bot/collision-review-${{ github.ref_name }}"
          delete-branch: false
          add-paths: |
            data/_pending/**
