name: Collect Responses

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_run:
    workflows: ["Create Form"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  check_tests:
    runs-on: ubuntu-latest
    # Only proceed if:
    # - not triggered by workflow_run
    # - OR Create Form succeeded
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      tests_ok: ${{ steps.check.outputs.tests_ok }}

    steps:
      - name: Check latest tests run success
        id: check
        uses: actions/github-script@v6
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'tests.yml',
              per_page: 1
            });

            if (!runs.data.workflow_runs || runs.data.workflow_runs.length === 0) {
              core.setOutput('tests_ok', 'false');
            } else {
              const conclusion = runs.data.workflow_runs[0].conclusion;
              core.setOutput('tests_ok', conclusion === 'success' ? 'true' : 'false');
            }

  collect_responses:
    needs: check_tests
    runs-on: ubuntu-latest
    if: ${{ needs.check_tests.outputs.tests_ok == 'true' }}

    env:
      TZ: Europe/Zurich
      OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
      REFRESH_TOKEN_JSON: ${{ secrets.REFRESH_TOKEN_JSON }}
      TOKEN_COLLECT_RESPONSES: "" # force use of refresh token

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run collect responses
        run: python collectResponses.py

      - name: Generate device index
        run: python generateIndex.py

      - name: Commit and push data outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Load collision filenames from the collision report if it exists
          COLLISION_FILES=$(python -c "
import json, pathlib, glob
reports = list(pathlib.Path('data/_pending').glob('collision_report_*.json'))
filenames = []
for r in reports:
    try:
        data = json.loads(r.read_text(encoding='utf-8'))
        filenames += [c['filename'] for c in data.get('collisions', [])]
    except (json.JSONDecodeError, OSError):
        pass
print(json.dumps(filenames))
")
          
          # Add non-collision files and always-include files
          git add data/form_responses.csv docs/devices_index.json docs/form_config.json 2>/dev/null || true
          
          # Add device JSON files, excluding those with collisions
          python -c "
          import json
          import pathlib
          import subprocess
          
          collision_files = $COLLISION_FILES
          collision_set = set(f + '.json' for f in collision_files)
          
          data_dir = pathlib.Path('data')
          for json_file in data_dir.glob('*.json'):
              if json_file.name not in collision_set and json_file.name != 'form_responses.json':
                  subprocess.run(['git', 'add', str(json_file)], check=False)
          "
          
          git commit -m "Update data from form responses" || echo "No changes to commit"
          git push

      - name: Detect collisions
        id: collisions
        run: |
          HAS_COLLISIONS=$(python -c "import json, pathlib; reports = list(pathlib.Path('data/_pending').glob('collision_report_*.json')); has = any(json.loads(r.read_text(encoding='utf-8')).get('collision_count', 0) > 0 for r in reports); print('true' if has else 'false')")
          echo "has_collisions=${HAS_COLLISIONS}" >> "$GITHUB_OUTPUT"

      - name: Open PR for collision review
        if: steps.collisions.outputs.has_collisions == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add pending collision records (run ${{ github.run_id }})"
          title: "Collision review needed — run ${{ github.run_id }} on ${{ github.ref_name }}"
          body: |
            This PR was created automatically because one or more form responses
            would overwrite existing device records.

            **Run:** `${{ github.run_id }}`
            **Branch:** `${{ github.ref_name }}`
            **Triggered by:** `${{ github.event_name }}`

            **Changes:** Modified device files are shown in the diff above.
            Collision metadata is in `data/_pending/collision_report_*.json`.

            Review the diffs for each device file, edit as needed, and merge when satisfied.
          branch: "bot/collision-review-${{ github.ref_name }}"
          delete-branch: false
          add-paths: |
            data/**
