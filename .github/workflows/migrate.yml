name: Run Data Migrations

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run migrations (dry-run first)
        run: python reprocessData.py --dry-run --verbose

      - name: Run migrations
        run: python reprocessData.py --verbose

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Apply schema migrations to data records"
          title: "chore: apply schema migrations to data records"
          body: |
            This PR was automatically generated by the **Run Data Migrations** workflow.

            It applies schema migrations to bring all data records in `data/` up to the current schema version.

            Please review the changes to ensure the migrations were applied correctly.
          branch: automated/schema-migration
          delete-branch: true
