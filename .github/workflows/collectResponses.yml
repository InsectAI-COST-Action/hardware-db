name: Collect Responses

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  check_tests:
    runs-on: ubuntu-latest

    outputs:
      tests_ok: ${{ steps.check.outputs.tests_ok }}

    steps:
      - name: Check latest tests and createForm run success
        id: check
        uses: actions/github-script@v6
        with:
          script: |
            async function getLatestConclusion(workflow_id) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                per_page: 1
              });
              if (!runs.data.workflow_runs || runs.data.workflow_runs.length === 0) return null;
              return runs.data.workflow_runs[0].conclusion;
            }

            const testsConclusion = await getLatestConclusion('tests.yml');
            const formConclusion = await getLatestConclusion('createForm.yml');

            const ok = testsConclusion === 'success' && formConclusion === 'success';
            core.info(`tests.yml: ${testsConclusion}, createForm.yml: ${formConclusion}`);
            core.setOutput('tests_ok', ok ? 'true' : 'false');

  collect_responses:
    needs: check_tests
    runs-on: ubuntu-latest
    if: ${{ needs.check_tests.outputs.tests_ok == 'true' }}

    env:
      TZ: Europe/Zurich
      OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
      REFRESH_TOKEN_JSON: ${{ secrets.REFRESH_TOKEN_JSON }}
      TOKEN_COLLECT_RESPONSES: "" # force use of refresh token

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Run collect responses
        run: python collectResponses.py

      - name: Generate device index
        run: python generateIndex.py

      - name: Commit and push data outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Extract collision filenames (if any) from timestamped collision reports
          COLLISION_FILES=$(python -c "import json,pathlib;reports=list(pathlib.Path('data/collisions').glob('collision_report_*.json'));filenames=[c['filename'] for r in reports for c in json.loads(r.read_text(encoding='utf-8')).get('collisions',[])];print(json.dumps(filenames))")

          # Stage always-included files
          git add data/form_responses.csv docs/devices_index.json docs/form_config.json 2>/dev/null || true

          # Stage device JSON files, skipping those involved in collisions
          COLLISION_FILES_JSON="$COLLISION_FILES" python -c "import json,pathlib,subprocess,os;collision_set=set(f+'.json' for f in json.loads(os.environ['COLLISION_FILES_JSON']));[subprocess.run(['git','add',str(f)],check=False) for f in pathlib.Path('data').glob('*.json') if f.name not in collision_set]"

          git commit -m "Update data from form responses" || echo "No changes to commit"
          git push

      - name: Detect collisions
        id: collisions
        run: |
          HAS_COLLISIONS=$(python -c "import json, pathlib; reports = list(pathlib.Path('data/collisions').glob('collision_report_*.json')); has = any(json.loads(r.read_text(encoding='utf-8')).get('collision_count', 0) > 0 for r in reports); print('true' if has else 'false')")
          echo "has_collisions=${HAS_COLLISIONS}" >> "$GITHUB_OUTPUT"

      - name: Open PR for collision review
        if: steps.collisions.outputs.has_collisions == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add pending collision records (run ${{ github.run_id }})"
          title: "Collision review needed — run ${{ github.run_id }} on ${{ github.ref_name }}"
          body: |
            This PR was created automatically because one or more form responses
            would overwrite existing device records.

            **Run:** `${{ github.run_id }}`
            **Branch:** `${{ github.ref_name }}`
            **Triggered by:** `${{ github.event_name }}`

            **Changes:** Modified device files are shown in the diff above.
            Collision metadata is in `data/collisions/collision_report_*.json`.

            Review the diffs for each device file, edit as needed, and merge when satisfied.
          branch: "bot/collision-review-${{ github.ref_name }}"
          delete-branch: false
          add-paths: |
            data/**
